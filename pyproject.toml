[project]
name = "courtesy-enrich"
version = "0.2.0"
description = "Multi-provider B2B executive contact enrichment pipeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "dnspython>=2.6",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "tldextract>=5.1",
    "anthropic>=0.116",
]

[project.optional-dependencies]
gsheets = ["gspread>=6.0", "google-auth>=2.29"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4"]

[project.scripts]
enrich = "enrich.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enrich"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: typer.Option/Argument defaults are idiomatic
